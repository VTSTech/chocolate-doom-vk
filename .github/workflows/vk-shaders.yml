name: VK shaders (libslang-vk)

# Chocolate Doom VK — build + smoke-test the libslang-vk integration.
#
# - Linux: full build with ENABLE_VK_SHADERS=ON, then a real game run on
#   lavapipe (software Vulkan) under Xvfb: freedoom + demo preset through
#   the preset chain, frame capture via -vkcapture, plus a compile check of
#   the ENABLE_VK_SHADERS=OFF fallback.
# - Windows MSYS2 (UCRT64, MinGW): CMake build; the zip step must glob real
#   files — a bare "." argument makes Info-ZIP exit 12 ("Nothing to do").
# - Windows MSVC (vcpkg): vcpkg is cloned at the release tag whose commit
#   is pinned as "builtin-baseline" in vcpkg.json — keep the two in sync.
#   CMake's toolchain consumes the manifest (auto-install at configure).

on:
  push:
    branches:
      - "master"
      - "vk-shaders"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  linux:
    name: Linux GCC (lavapipe smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libsdl2-dev libsdl2-mixer-dev libpng-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb freedoom

      - name: Configure (VK ON)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF

      - name: Build (VK ON)
        run: cmake --build build

      - name: Smoke test (Xvfb + lavapipe + freedoom)
        run: |
          set -e
          # Stage the demo preset from the fetched libslang-vk source tree.
          mkdir -p smoke/shaders
          cp build/_deps/libslang-vk-src/examples/presets/demo-bright.slangp smoke/
          cp build/_deps/libslang-vk-src/examples/presets/shaders/demo_bright.slang \
             build/_deps/libslang-vk-src/examples/presets/shaders/demo_downsample.slang \
             build/_deps/libslang-vk-src/examples/presets/shaders/demo_glow_combine.slang \
             smoke/shaders/
          # Pin the config dir so gpu-scaler.log lands in the workspace
          # (SDL_GetPrefPath honours XDG_DATA_HOME on Linux). The Vulkan
          # path logs to the file only — the console mirror became opt-in
          # (-vklog) in 3.0.5 — so the I_VK assertions gate on the file,
          # and console silence is asserted as a feature.
          export XDG_DATA_HOME="$PWD/xdg-data"
          cd smoke
          xvfb-run -a -s "-screen 0 1024x768x24" \
            stdbuf -oL -eL timeout -s KILL 90 \
            ../build/src/chocolate-doom \
              -iwad /usr/share/games/doom/freedoom1.wad \
              -shader demo-bright.slangp \
              -timedemo demo1 -window -2 -nosound -nomusic \
              -vkcapture 240 > smoke.log 2>&1 || true
          LOG="$XDG_DATA_HOME/chocolate-doom/gpu-scaler.log"
          echo "--- session log: $LOG ---"
          test -s "$LOG"
          grep -q "libslang-vk active" "$LOG"
          grep -q "captured frame" "$LOG"
          echo "--- console ---"
          # Vanilla output still reaches the console...
          grep -E "timed" smoke.log
          # ...and the I_VK stream does not (that is the 3.0.5 contract).
          if grep -qE "I_VK" smoke.log; then
            echo "CONSOLE NOT CLEAN — I_VK lines reached stdout/stderr"; exit 1
          fi
          # Validation messages would land on either stream.
          grep -qE "Validation|VUID" smoke.log "$LOG" && { echo "VALIDATION MESSAGES FOUND"; exit 1; } || true
          test -s vkframe.tga
          echo "SMOKE OK: $(file vkframe.tga)"

      - name: Configure + build (VK OFF fallback)
        run: |
          cmake -S . -B build-novk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF \
            -DENABLE_VK_SHADERS=OFF
          cmake --build build-novk

      # A user-facing artifact from the same job that smoke-tests it.
      # lavapipe is only the CI test driver — these binaries use
      # whatever Vulkan ICD the player's system has (or none at all:
      # the classic renderer needs no Vulkan). Portability notes:
      # - the executables carry a $ORIGIN rpath and find the bundled
      #   libslang-vk.so next to them;
      # - the ldd walk bundles the non-glibc shared deps (SDL2,
      #   SDL2_mixer, libpng, X11 stack) so the tar runs on any distro
      #   new enough for the runner's glibc — bundling glibc itself
      #   never works;
      # - glibc floor: whatever ubuntu-latest ships when the artifact
      #   was built (see pkg/README.txt inside the archive).
      - name: Package (Linux x64)
        run: |
          set -eux
          mkdir -p pkg
          cp -a build/src/chocolate-doom build/src/chocolate-heretic \
                build/src/chocolate-hexen build/src/chocolate-strife \
                build/src/chocolate-setup build/src/chocolate-server pkg/
          # The shared shader library, deployed next to the exes by the
          # slangvk-runtime step. Missing it means a dead artifact —
          # fail the job loudly instead.
          test -f build/src/libslang-vk.so
          cp -a build/src/libslang-vk.so pkg/
          # Bundle the shared-library deps an end user may not have.
          # Fixpoint: ldd every binary and then every library we
          # collected, until no new ones appear (covers SDL2 -> X11 ->
          # xcb chains). glibc core and the C++ runtime stay on the
          # host: shipping those against the system loader breaks in
          # creative ways, and any distro new enough for this build's
          # glibc has new-enough versions of them anyway.
          collect_deps() {
            for f in pkg/chocolate-* pkg/*.so*; do
              ldd "$f" 2>/dev/null | awk '$3 ~ /^\// {print $3}'
            done | sort -u | grep -Ev \
              '(ld-linux|libc\.so\.|libm\.so\.|libpthread|libdl\.so|librt\.so|libresolv|libgcc_s|libstdc\+\+)' || true
          }
          while :; do
            before=$(ls pkg/*.so* 2>/dev/null | wc -l)
            collect_deps | while read -r so; do cp -Ln "$so" pkg/; done
            after=$(ls pkg/*.so* 2>/dev/null | wc -l)
            [ "$after" -eq "$before" ] && break
          done
          GLIBC=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          cat > pkg/README.txt <<EOF
          Chocolate Doom VK - Linux x64 build
          ===================================

          Built on $(. /etc/os-release && echo "$PRETTY_NAME") with glibc ${GLIBC}:
          needs a distro of similar age or newer (glibc >= ${GLIBC}).

          Contents: the four games, chocolate-setup, the dedicated
          server, the shared shader library (libslang-vk.so) and the
          bundled runtime libraries. The executables find them via
          their \$ORIGIN rpath - untar anywhere and run; do not split
          the files up.

          The Vulkan shader path needs a Vulkan-capable driver (any
          GPU ICD; mesa-vulkan-drivers provides lavapipe for software
          rendering). Without one the games still run on the classic
          SDL2 renderer. You need your own IWAD (e.g. freedoom):
          place doom1.wad/freedoom1.wad next to the binaries or pass
          -iwad.

          Key flags: -shader <preset.slangp> (Vulkan shader chain),
          -novulkan, -vkcapture <n>, -vklog (echo the log stream to the
          console), Scroll Lock toggles the stats overlay, Alt+A cycles
          aspect, Alt+B cycles shader base resolution, PrintScreen takes
          a screenshot. Everything is logged to gpu-scaler.log in the
          config directory (~/.local/share/chocolate-doom/ on Linux,
          next to the binaries on Windows).

          See README-VK.md in the repository for full documentation.
          EOF
          # Commit stamp so every artifact is traceable to its build.
          cat > pkg/BUILD-INFO.txt <<EOF
          commit: ${GITHUB_SHA}
          short:  ${GITHUB_SHA::8}
          ref:    ${GITHUB_REF}
          event:  ${GITHUB_EVENT_NAME}
          built:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          tar czf chocolate-doom-vk-linux-x64.tar.gz -C pkg .
          tar tzf chocolate-doom-vk-linux-x64.tar.gz | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-vk-linux-x64-${{ env.SHORT_SHA }}
          path: chocolate-doom-vk-linux-x64.tar.gz

  windows-msys2:
    name: Windows MSYS2 (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-libpng
            zip

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build build

      - name: Package
        run: |
          set -x
          mkdir -p pkg
          cp build/src/chocolate-{doom,heretic,hexen,strife,setup}.exe pkg/
          # The shader DLL the games import at runtime. The slangvk-runtime
          # build step places it next to the exes; the ldd walk below only
          # collects /ucrt64 runtime DLLs and would never pick it up — a
          # zip without it dies at launch with a "libslang-vk.dll not
          # found" dialog. Fail the job loudly instead of shipping a
          # broken zip.
          test -f build/src/libslang-vk.dll
          cp build/src/libslang-vk.dll pkg/
          # The MinGW runtime DLLs the binaries need on clean systems.
          # Walk every game binary (not just chocolate-doom) so setup's
          # dependencies are covered too; || true per line for binaries
          # that resolve no /ucrt64 libraries.
          for exe in build/src/chocolate-{doom,heretic,hexen,strife,setup}.exe; do
            ldd "$exe" | grep ucrt64 | cut -d' ' -f3 || true
          done | sort -u | xargs -r -I{} cp {} pkg/
          # Commit stamp so the artifact is traceable to its build.
          cat > pkg/BUILD-INFO.txt <<EOF
          commit: ${GITHUB_SHA}
          short:  ${GITHUB_SHA::8}
          ref:    ${GITHUB_REF}
          event:  ${GITHUB_EVENT_NAME}
          built:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          # zip needs real file arguments: a bare "." without -r matches
          # nothing and exits 12 ("Nothing to do"). Glob instead.
          cd pkg
          zip -q ../chocolate-doom-vk-windows-ucrt64.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-vk-windows-ucrt64-${{ env.SHORT_SHA }}
          path: chocolate-doom-vk-windows-ucrt64.zip

  windows-msvc:
    name: Windows MSVC (vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1

      # Own pinned clone instead of lukka/run-vcpkg: the action refuses to
      # run without a manifest baseline, and a clone at the exact tag that
      # matches vcpkg.json's builtin-baseline is fully deterministic
      # (baseline == HEAD, so git rev-parse always resolves).
      - name: Set up vcpkg (pinned 2026.07.29)
        shell: cmd
        run: |
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "%RUNNER_TEMP%\vcpkg"
          "%RUNNER_TEMP%\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      # Manifest mode: configure auto-installs the vcpkg.json dependencies
      # into build\vcpkg_installed\x64-windows. No Vulkan SDK needed
      # anywhere (libslang-vk vendors volk; the presenter resolves its few
      # entry points at runtime).
      - name: Configure + build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DENABLE_SDL2_NET=OFF ^
            -DCMAKE_TOOLCHAIN_FILE="%RUNNER_TEMP%\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item build\src\chocolate-*.exe pkg\
          # The shader DLL the games import at runtime (the slangvk-runtime
          # build step places it next to the exes; z-applocal only handles
          # vcpkg-installed DLLs). Fail loudly instead of shipping a zip
          # that cannot launch.
          if (-not (Test-Path build\src\libslang-vk.dll)) {
            throw "build\src\libslang-vk.dll is missing - nothing to ship"
          }
          Copy-Item build\src\libslang-vk.dll pkg\
          if (Test-Path build\vcpkg_installed) {
            Copy-Item build\vcpkg_installed\x64-windows\bin\*.dll pkg\
          }
          # Commit stamp so the artifact is traceable to its build.
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $buildInfo = @"
          commit:  $env:GITHUB_SHA
          short:   $shortSha
          ref:     $env:GITHUB_REF
          event:   $env:GITHUB_EVENT_NAME
          built:   $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC'))
          run:     $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          $buildInfo | Set-Content -Path pkg/BUILD-INFO.txt
          Add-Content -Path $env:GITHUB_ENV -Value "SHORT_SHA=$shortSha"
          Compress-Archive -Path pkg\* -DestinationPath chocolate-doom-vk-windows-msvc.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-vk-windows-msvc-${{ env.SHORT_SHA }}
          path: chocolate-doom-vk-windows-msvc.zip
